<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE Admin Dashboard</title>
    <link rel="icon" type="image/png" href="shared/ace-sprites/ace-48-happy.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #080C1A; color: #e0e0e0; min-height: 100vh; }

        /* Login Gate */
        .login-overlay { position: fixed; inset: 0; background: #080C1A; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: rgba(20,24,38,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 40px; width: 90%; max-width: 400px; text-align: center; backdrop-filter: blur(20px); }
        .login-box h2 { color: #D4A853; margin-bottom: 24px; font-size: 1.3rem; }
        .login-box input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #eee; font-size: 16px; margin-bottom: 16px; text-align: center; letter-spacing: 2px; outline: none; }
        .login-box input:focus { border-color: #D4A853; }
        .login-box button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, #D4A853, #b8912e); color: #0a0a0a; font-weight: 700; font-size: 16px; cursor: pointer; }
        .login-error { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }

        /* Layout */
        .admin-wrap { display: none; }
        .admin-wrap.show { display: block; }
        .topbar { background: rgba(8,12,26,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .topbar h1 { font-size: 1.2rem; font-weight: 800; color: #D4A853; }
        .topbar-right { display: flex; gap: 8px; align-items: center; }
        .content { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* Buttons */
        .btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s; }
        .btn-gold { background: linear-gradient(135deg, #D4A853, #b8912e); color: #0a0a0a; }
        .btn-gold:hover { transform: translateY(-1px); }
        .btn-danger { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .btn-danger:hover { background: rgba(239,68,68,0.25); }
        .btn-success { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.2); }
        .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #8891a8; }
        .btn-ghost:hover { border-color: #D4A853; color: #D4A853; }
        .btn-sm { padding: 5px 10px; font-size: 11px; }

        /* Revenue Cards */
        .revenue-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        @media (max-width: 768px) { .revenue-grid { grid-template-columns: repeat(2, 1fr); } }
        .rev-card { background: rgba(20,24,38,0.6); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px; }
        .rev-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #6b7280; font-weight: 600; margin-bottom: 8px; }
        .rev-value { font-size: 28px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
        .rev-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
        .rev-green { color: #10b981; }
        .rev-gold { color: #D4A853; }
        .rev-blue { color: #3b82f6; }
        .rev-purple { color: #a855f7; }

        /* Sections */
        .section { background: rgba(20,24,38,0.6); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-title { font-size: 16px; font-weight: 700; color: #e0e0e0; }

        /* Table */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; color: #6b7280; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.06); font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .badge-active { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge-inactive { background: rgba(239,68,68,0.15); color: #ef4444; }
        .badge-yearly { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .badge-lifetime { background: rgba(168,85,247,0.15); color: #a855f7; }
        .student-name { font-weight: 600; color: #e0e0e0; cursor: pointer; }
        .student-name:hover { color: #D4A853; }

        /* Generate Code Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 200; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: #12122a; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 32px; width: 90%; max-width: 420px; }
        .modal h3 { color: #D4A853; margin-bottom: 16px; }
        .modal label { display: block; font-size: 12px; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; margin-top: 12px; }
        .modal input, .modal select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #eee; font-size: 14px; outline: none; }
        .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
        .code-display { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: #D4A853; text-align: center; padding: 16px; background: rgba(212,168,83,0.1); border-radius: 10px; margin-top: 12px; letter-spacing: 3px; cursor: pointer; }
        .code-display:hover::after { content: ' (click to copy)'; font-size: 11px; color: #6b7280; }

        /* Student Detail Panel */
        .detail-panel { position: fixed; top: 0; right: -500px; width: 480px; max-width: 100vw; height: 100vh; background: #0c0f1e; border-left: 1px solid rgba(255,255,255,0.08); z-index: 300; transition: right 0.3s ease; overflow-y: auto; padding: 24px; }
        .detail-panel.open { right: 0; }
        .detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 299; display: none; }
        .detail-overlay.show { display: block; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .detail-close { width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: none; color: #6b7280; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .detail-close:hover { color: #ef4444; border-color: rgba(239,68,68,0.3); }
        .detail-stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
        .detail-stat-label { color: #6b7280; }
        .detail-stat-value { font-weight: 600; }
        .detail-section { margin-top: 20px; }
        .detail-section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #D4A853; font-weight: 700; margin-bottom: 8px; }
    </style>
</head>
<body>

<!-- LOGIN GATE -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2>🔐 ACE Admin</h2>
        <input type="password" id="adminPw" placeholder="Admin Password" onkeydown="if(event.key==='Enter')adminLogin()">
        <button onclick="adminLogin()">Unlock</button>
        <div class="login-error" id="loginError">Wrong password.</div>
    </div>
</div>

<!-- ADMIN DASHBOARD -->
<div class="admin-wrap" id="adminWrap">
    <div class="topbar">
        <h1>⚡ ACE Admin Dashboard</h1>
        <div class="topbar-right">
            <button class="btn btn-gold" onclick="showGenerateModal()">+ Generate Code</button>
            <button class="btn btn-ghost" onclick="loadData()">↻ Refresh</button>
            <button class="btn btn-ghost" onclick="adminLogout()">Sign Out</button>
        </div>
    </div>

    <div class="content">
        <!-- Revenue Cards -->
        <div class="revenue-grid" id="revenueGrid">
            <div class="rev-card"><div class="rev-label">Total Revenue</div><div class="rev-value rev-green" id="revTotal">$0</div><div class="rev-sub" id="revTotalSub">Loading...</div></div>
            <div class="rev-card"><div class="rev-label">Active Students</div><div class="rev-value rev-gold" id="revStudents">0</div><div class="rev-sub" id="revStudentsSub">—</div></div>
            <div class="rev-card"><div class="rev-label">Yearly Plans</div><div class="rev-value rev-blue" id="revYearly">0</div><div class="rev-sub">$247/yr each</div></div>
            <div class="rev-card"><div class="rev-label">Lifetime Plans</div><div class="rev-value rev-purple" id="revLifetime">0</div><div class="rev-sub">$397 each</div></div>
        </div>

        <!-- Students Table -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">📋 Enrolled Students</div>
                <div style="font-size:12px;color:#6b7280;" id="studentCount"></div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Student</th><th>Code</th><th>Plan</th><th>Status</th><th>Enrolled</th><th>Last Active</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="studentBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">📊 Recent Activity</div>
            </div>
            <div id="activityFeed" style="font-size:13px;color:#8891a8;">Loading...</div>
        </div>
    </div>
</div>

<!-- Generate Code Modal -->
<div class="modal-overlay" id="genModal">
    <div class="modal">
        <h3>Generate Access Code</h3>
        <div id="genForm">
            <label>Plan</label>
            <select id="genPlan">
                <option value="yearly">Yearly ($247)</option>
                <option value="lifetime">Lifetime ($397)</option>
            </select>
            <label>Student Email (optional)</label>
            <input type="email" id="genEmail" placeholder="student@example.com">
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeGenModal()">Cancel</button>
                <button class="btn btn-gold" onclick="generateCode()">Generate</button>
            </div>
        </div>
        <div id="genResult" style="display:none;">
            <p style="color:#10b981;margin-bottom:8px;">✓ Code generated!</p>
            <div class="code-display" id="genCodeDisplay" onclick="copyCode()"></div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeGenModal()">Done</button>
                <button class="btn btn-gold" onclick="copyCode()">📋 Copy Code</button>
            </div>
        </div>
    </div>
</div>

<!-- Student Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
    <div class="detail-header">
        <h2 id="detailName" style="font-size:18px;font-weight:700;"></h2>
        <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailContent"></div>
</div>

<script>
const SUPA_URL = 'https://gwxgnlasxzpbipcdavcd.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3eGdubGFzeHpwYmlwY2RhdmNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4ODAyNDIsImV4cCI6MjA4NzQ1NjI0Mn0.cjTXz8OLtX4Yt6CX2Sx3n0GXwbrHqS_uH-mK5PivKTk';
const ADMIN_HASH = '2ced325b32f97a4e24d9d30f0bcbc7f34a2f0512b0d72f468ec2cb7ec3cae6cd';
const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);
let allStudents = [];

async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function adminLogin() {
    const pw = document.getElementById('adminPw').value;
    const hash = await sha256(pw);
    if (hash === ADMIN_HASH) {
        sessionStorage.setItem('ace_admin', 'true');
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('adminWrap').classList.add('show');
        loadData();
    } else {
        document.getElementById('loginError').style.display = 'block';
    }
}

function adminLogout() {
    sessionStorage.removeItem('ace_admin');
    location.reload();
}

// Check session
if (sessionStorage.getItem('ace_admin') === 'true') {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('adminWrap').classList.add('show');
    setTimeout(loadData, 100);
}

async function loadData() {
    // Load enrollments
    const { data: students } = await db.from('ace_enrollments').select('*').order('created_at', { ascending: false });
    allStudents = students || [];

    // Load recent activity
    const { data: sessions } = await db.from('ace_session_summaries').select('*').order('created_at', { ascending: false }).limit(20);
    const { data: events } = await db.from('ace_question_events').select('*').order('created_at', { ascending: false }).limit(50);

    renderRevenue(allStudents);
    renderStudents(allStudents);
    renderActivity(sessions || [], events || [], allStudents);
}

function renderRevenue(students) {
    const active = students.filter(s => s.is_active);
    const yearly = active.filter(s => s.plan === 'yearly');
    const lifetime = active.filter(s => s.plan === 'lifetime');
    // Exclude test codes from revenue
    const paidYearly = yearly.filter(s => !s.access_code.startsWith('ACE-TEST') && s.access_code !== 'ACE-4155-65D7');
    const paidLifetime = lifetime.filter(s => !s.access_code.startsWith('ACE-TEST') && s.access_code !== 'ACE-4155-65D7');
    const totalRev = (paidYearly.length * 247) + (paidLifetime.length * 397);

    document.getElementById('revTotal').textContent = '$' + totalRev.toLocaleString();
    document.getElementById('revTotalSub').textContent = paidYearly.length + paidLifetime.length + ' paid enrollments';
    document.getElementById('revStudents').textContent = active.length;
    document.getElementById('revStudentsSub').textContent = students.length + ' total (' + (students.length - active.length) + ' inactive)';
    document.getElementById('revYearly').textContent = yearly.length;
    document.getElementById('revLifetime').textContent = lifetime.length;
}

function renderStudents(students) {
    document.getElementById('studentCount').textContent = students.length + ' total';
    const tbody = document.getElementById('studentBody');
    tbody.innerHTML = students.map(s => {
        const name = s.student_name || '—';
        const planBadge = s.plan === 'lifetime'
            ? '<span class="badge badge-lifetime">Lifetime</span>'
            : '<span class="badge badge-yearly">Yearly</span>';
        const statusBadge = s.is_active
            ? '<span class="badge badge-active">Active</span>'
            : '<span class="badge badge-inactive">Inactive</span>';
        const enrolled = s.activated_at ? new Date(s.activated_at).toLocaleDateString() : (s.created_at ? new Date(s.created_at).toLocaleDateString() : '—');

        return '<tr>' +
            '<td><span class="student-name" onclick="showDetail(\'' + s.id + '\')">' + name + '</span><br><span style="font-size:11px;color:#6b7280;">' + (s.email || '') + '</span></td>' +
            '<td style="font-family:JetBrains Mono,monospace;font-size:12px;color:#8891a8;">' + s.access_code + '</td>' +
            '<td>' + planBadge + '</td>' +
            '<td>' + statusBadge + '</td>' +
            '<td style="font-size:12px;color:#6b7280;">' + enrolled + '</td>' +
            '<td style="font-size:12px;color:#6b7280;">—</td>' +
            '<td>' +
                (s.is_active
                    ? '<button class="btn btn-danger btn-sm" onclick="toggleStudent(\'' + s.id + '\', false)">Deactivate</button>'
                    : '<button class="btn btn-success btn-sm" onclick="toggleStudent(\'' + s.id + '\', true)">Reactivate</button>') +
            '</td></tr>';
    }).join('');
}

function renderActivity(sessions, events, students) {
    const nameMap = {};
    students.forEach(s => { nameMap[s.id] = s.student_name || s.access_code; });

    let html = '';
    sessions.slice(0, 10).forEach(s => {
        const name = nameMap[s.session_id] || s.session_id.slice(0, 8);
        const time = new Date(s.created_at).toLocaleString();
        const pct = s.score_pct || 0;
        const color = pct >= 80 ? '#10b981' : pct >= 60 ? '#fbbf24' : '#ef4444';
        html += '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center;">' +
            '<div><strong style="color:#e0e0e0;">' + name + '</strong> completed <span style="color:#D4A853;">' + (s.format || 'session') + '</span> — ' + s.lesson_id + '</div>' +
            '<div><span style="color:' + color + ';font-weight:700;">' + pct + '%</span> <span style="color:#52525b;font-size:11px;">' + time + '</span></div>' +
            '</div>';
    });

    if (!html) html = '<div style="color:#52525b;">No activity yet.</div>';
    document.getElementById('activityFeed').innerHTML = html;
}

async function showDetail(id) {
    const student = allStudents.find(s => s.id === id);
    if (!student) return;

    document.getElementById('detailName').textContent = student.student_name || 'Unknown';
    document.getElementById('detailOverlay').classList.add('show');
    document.getElementById('detailPanel').classList.add('open');

    // Load student's activity
    const { data: events } = await db.from('ace_question_events').select('*').eq('session_id', id).order('created_at', { ascending: false });
    const { data: sessions } = await db.from('ace_session_summaries').select('*').eq('session_id', id).order('created_at', { ascending: false });

    const evts = events || [];
    const sess = sessions || [];
    const totalQ = evts.length;
    const correctQ = evts.filter(e => e.is_correct).length;
    const accuracy = totalQ > 0 ? Math.round((correctQ / totalQ) * 100) : 0;
    const formats = {};
    evts.forEach(e => { formats[e.format] = (formats[e.format] || 0) + 1; });

    let html = '';
    html += '<div class="detail-stat"><span class="detail-stat-label">Email</span><span class="detail-stat-value">' + (student.email || '—') + '</span></div>';
    html += '<div class="detail-stat"><span class="detail-stat-label">Plan</span><span class="detail-stat-value">' + (student.plan || '—') + '</span></div>';
    html += '<div class="detail-stat"><span class="detail-stat-label">Access Code</span><span class="detail-stat-value" style="font-family:JetBrains Mono,monospace;">' + student.access_code + '</span></div>';
    html += '<div class="detail-stat"><span class="detail-stat-label">Enrolled</span><span class="detail-stat-value">' + (student.activated_at ? new Date(student.activated_at).toLocaleString() : new Date(student.created_at).toLocaleString()) + '</span></div>';
    html += '<div class="detail-stat"><span class="detail-stat-label">Status</span><span class="detail-stat-value">' + (student.is_active ? '✅ Active' : '❌ Inactive') + '</span></div>';

    html += '<div class="detail-section"><div class="detail-section-title">Performance</div>';
    html += '<div class="detail-stat"><span class="detail-stat-label">Total Questions</span><span class="detail-stat-value">' + totalQ + '</span></div>';
    html += '<div class="detail-stat"><span class="detail-stat-label">Correct</span><span class="detail-stat-value" style="color:#10b981;">' + correctQ + '</span></div>';
    html += '<div class="detail-stat"><span class="detail-stat-label">Accuracy</span><span class="detail-stat-value" style="color:' + (accuracy >= 80 ? '#10b981' : accuracy >= 60 ? '#fbbf24' : '#ef4444') + ';">' + accuracy + '%</span></div>';
    html += '<div class="detail-stat"><span class="detail-stat-label">Sessions</span><span class="detail-stat-value">' + sess.length + '</span></div>';
    html += '</div>';

    if (Object.keys(formats).length > 0) {
        html += '<div class="detail-section"><div class="detail-section-title">Activity by Format</div>';
        Object.entries(formats).forEach(([fmt, count]) => {
            html += '<div class="detail-stat"><span class="detail-stat-label">' + fmt + '</span><span class="detail-stat-value">' + count + ' questions</span></div>';
        });
        html += '</div>';
    }

    if (sess.length > 0) {
        html += '<div class="detail-section"><div class="detail-section-title">Recent Sessions</div>';
        sess.slice(0, 5).forEach(s => {
            const color = (s.score_pct || 0) >= 80 ? '#10b981' : (s.score_pct || 0) >= 60 ? '#fbbf24' : '#ef4444';
            html += '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:12px;">' +
                '<div style="display:flex;justify-content:space-between;">' +
                '<span style="color:#D4A853;">' + (s.format || '?') + '</span>' +
                '<span style="color:' + color + ';font-weight:700;">' + (s.score_pct || 0) + '%</span>' +
                '</div>' +
                '<div style="color:#52525b;">' + s.lesson_id + ' — ' + new Date(s.created_at).toLocaleString() + '</div>' +
                '</div>';
        });
        html += '</div>';
    }

    document.getElementById('detailContent').innerHTML = html;
}

function closeDetail() {
    document.getElementById('detailOverlay').classList.remove('show');
    document.getElementById('detailPanel').classList.remove('open');
}

// Generate Code
function showGenerateModal() {
    document.getElementById('genForm').style.display = 'block';
    document.getElementById('genResult').style.display = 'none';
    document.getElementById('genEmail').value = '';
    document.getElementById('genModal').classList.add('show');
}
function closeGenModal() { document.getElementById('genModal').classList.remove('show'); }

async function generateCode() {
    const plan = document.getElementById('genPlan').value;
    const email = document.getElementById('genEmail').value.trim();
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let seg1 = '', seg2 = '';
    for (let i = 0; i < 4; i++) { seg1 += chars[Math.floor(Math.random() * chars.length)]; seg2 += chars[Math.floor(Math.random() * chars.length)]; }
    const code = 'ACE-' + seg1 + '-' + seg2;

    const row = { access_code: code, plan: plan, is_active: true };
    if (email) row.email = email;

    await db.from('ace_enrollments').insert(row);

    document.getElementById('genForm').style.display = 'none';
    document.getElementById('genResult').style.display = 'block';
    document.getElementById('genCodeDisplay').textContent = code;
    loadData();
}

function copyCode() {
    const code = document.getElementById('genCodeDisplay').textContent;
    navigator.clipboard.writeText(code);
    document.getElementById('genCodeDisplay').style.background = 'rgba(16,185,129,0.15)';
    setTimeout(() => { document.getElementById('genCodeDisplay').style.background = 'rgba(212,168,83,0.1)'; }, 1000);
}

async function toggleStudent(id, active) {
    await db.from('ace_enrollments').update({ is_active: active }).eq('id', id);
    loadData();
}
</script>
</body>
</html>
