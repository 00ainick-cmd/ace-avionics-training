<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom | CAET Prep</title>
    <link rel="icon" type="image/png" href="shared/ace-sprites/ace-48-happy.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="shared/ace-theme.css">
    <style>
        /* BASE & BACKGROUND */
        body {
            position: relative;
            background-color: #080C1A;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Background Orbs */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .orb-1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(97, 175, 239, 0.08) 0%, transparent 70%);
            filter: blur(60px);
            animation: float 20s ease-in-out infinite alternate;
        }

        .orb-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(212, 168, 83, 0.06) 0%, transparent 70%);
            filter: blur(60px);
            animation: float 25s ease-in-out infinite alternate-reverse;
        }

        .orb-3 {
            position: absolute;
            top: 40%;
            left: 40%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(45, 189, 137, 0.05) 0%, transparent 70%);
            filter: blur(60px);
            animation: pulse 15s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(50px, 80px) scale(1.1);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 40px 24px 100px;
            position: relative;
            z-index: 10;
        }

        /* PREMIUM HERO BANNER */
        .hero-banner {
            position: relative;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 56px;
            padding: 40px;
            background: rgba(20, 24, 38, 0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--blue), var(--gold));
            box-shadow: 0 0 20px rgba(97, 175, 239, 0.8);
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(97, 175, 239, 0.08) 0%, transparent 50%);
            animation: rotateSlow 20s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes rotateSlow {
            100% {
                transform: rotate(360deg);
            }
        }

        .hero-icon-wrap {
            width: 72px;
            height: 72px;
            background: rgba(97, 175, 239, 0.1);
            border: 1px solid rgba(97, 175, 239, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(97, 175, 239, 0.2) inset;
            flex-shrink: 0;
            position: relative;
        }

        .hero-icon-wrap::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            background: linear-gradient(45deg, transparent, rgba(97, 175, 239, 0.3), transparent);
            z-index: -1;
            animation: borderPulse 3s ease-in-out infinite;
        }

        @keyframes borderPulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .hero-icon-wrap svg {
            width: 36px;
            height: 36px;
            color: var(--blue);
            filter: drop-shadow(0 0 8px rgba(97, 175, 239, 0.5));
        }

        .hero-content {
            flex: 1;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a0aec0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 800px;
            font-weight: 400;
        }

        /* SECTION STYLING */
        .resource-section {
            margin-bottom: 56px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            background: rgba(212, 168, 83, 0.1);
            color: var(--gold);
            border: 1px solid rgba(212, 168, 83, 0.3);
            box-shadow: 0 0 15px rgba(212, 168, 83, 0.15) inset;
        }

        .section-badge.green {
            background: rgba(45, 189, 137, 0.1);
            color: #2DBD89;
            border: 1px solid rgba(45, 189, 137, 0.3);
            box-shadow: 0 0 15px rgba(45, 189, 137, 0.15) inset;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.1), transparent);
        }

        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        /* GLASSMORPHIC CARDS */
        .resource-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(20, 24, 38, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: all 400ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            z-index: 1;
        }

        .resource-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 300ms ease;
            z-index: -1;
        }

        .resource-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: transparent;
            transition: all 300ms ease;
        }

        /* Hover States based on type */
        .resource-card.rise {
            border-left: 1px solid rgba(212, 168, 83, 0.2);
        }

        .resource-card.rise:hover {
            border-color: rgba(212, 168, 83, 0.5);
            box-shadow: 0 16px 40px rgba(212, 168, 83, 0.2), inset 0 0 20px rgba(212, 168, 83, 0.05);
            transform: translateY(-6px) scale(1.02);
            z-index: 10;
        }

        .resource-card.rise:hover::after {
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold);
        }

        .resource-card.notebook {
            border-left: 1px solid rgba(45, 189, 137, 0.2);
        }

        .resource-card.notebook:hover {
            border-color: rgba(45, 189, 137, 0.5);
            box-shadow: 0 16px 40px rgba(45, 189, 137, 0.2), inset 0 0 20px rgba(45, 189, 137, 0.05);
            transform: translateY(-6px) scale(1.02);
            z-index: 10;
        }

        .resource-card.notebook:hover::after {
            background: #2DBD89;
            box-shadow: 0 0 15px #2DBD89;
        }

        .resource-card.book {
            border-left: 1px solid rgba(97, 175, 239, 0.2);
        }

        .resource-card.book:hover {
            border-color: rgba(97, 175, 239, 0.5);
            box-shadow: 0 16px 40px rgba(97, 175, 239, 0.2), inset 0 0 20px rgba(97, 175, 239, 0.05);
            transform: translateY(-6px) scale(1.02);
            z-index: 10;
        }

        .resource-card.book:hover::after {
            background: var(--blue);
            box-shadow: 0 0 15px var(--blue);
        }

        .resource-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .resource-card:hover .resource-icon {
            transform: scale(1.15) rotate(5deg);
        }

        /* Colors for icons */
        .resource-card.rise .resource-icon {
            background: rgba(212, 168, 83, 0.1);
            color: var(--gold);
            border: 1px solid rgba(212, 168, 83, 0.3);
            box-shadow: 0 0 15px rgba(212, 168, 83, 0.15) inset;
        }

        .resource-card.notebook .resource-icon {
            background: rgba(45, 189, 137, 0.1);
            color: #2DBD89;
            border: 1px solid rgba(45, 189, 137, 0.3);
            box-shadow: 0 0 15px rgba(45, 189, 137, 0.15) inset;
        }

        .resource-card.book .resource-icon {
            background: rgba(97, 175, 239, 0.1);
            color: var(--blue);
            border: 1px solid rgba(97, 175, 239, 0.3);
            box-shadow: 0 0 15px rgba(97, 175, 239, 0.15) inset;
        }

        .resource-icon svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .resource-info {
            flex: 1;
            min-width: 0;
        }

        .resource-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }

        .resource-meta {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .resource-action {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 400ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateX(-15px) scale(0.8);
            opacity: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .resource-card:hover .resource-action {
            transform: translateX(0) scale(1);
            opacity: 1;
        }

        .resource-card.rise:hover .resource-action {
            color: var(--gold);
            background: rgba(212, 168, 83, 0.15);
            border-color: rgba(212, 168, 83, 0.3);
        }

        .resource-card.notebook:hover .resource-action {
            color: #2DBD89;
            background: rgba(45, 189, 137, 0.15);
            border-color: rgba(45, 189, 137, 0.3);
        }

        .resource-card.book:hover .resource-action {
            color: var(--blue);
            background: rgba(97, 175, 239, 0.15);
            border-color: rgba(97, 175, 239, 0.3);
        }

        @media (max-width: 768px) {
            .resource-grid {
                grid-template-columns: 1fr;
            }

            .hero-banner {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
            }

            .hero-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-orbs">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        <div class="orb-3"></div>
    </div>
    <header class="topbar">
        <div class="topbar-logo">
            <a href="dashboard.html" style="text-decoration:none;">
                <img src="shared/logo.png" alt="ACE Avionics Training" class="logo-img">
            </a>
        </div>
        <div class="topbar-right">
            <a href="javascript:history.back()" class="topbar-btn">Back</a>
        </div>
    </header>
    <main class="main">
        <div class="hero-banner">
            <div class="hero-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
            </div>
            <div class="hero-content">
                <h1 class="hero-title">The Classroom</h1>
                <p class="hero-desc">Deep-dive into the official curriculum. Read the textbooks, engage with the
                    interactive Rise modules, and leverage AI to trace your knowledge in an immersive environment.</p>
            </div>
        </div>
        <div class="resource-section">
            <div class="section-header">
                <div class="section-title">Rise Modules <span class="section-badge">8 Available</span></div>
                <div class="section-line"></div>
            </div>
            <div class="resource-grid" id="riseModulesList">
                <!-- Populated by JS -->
            </div>
        </div>
        <div class="resource-section" style="margin-top: 64px;">
            <div class="section-header" style="justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="section-title" style="color: #fff;">Study Materials & AI Guides <span
                            class="section-badge green">Tools</span></div>
                    <div class="section-line" style="width: 50px; flex: none;"></div>
                </div>
                <button
                    onclick="alert('NotebookLM Tutorial: 1. Download course PDF. 2. Upload to NotebookLM. 3. Ask it questions about the material!')"
                    class="section-badge"
                    style="cursor: pointer; background: transparent; color: var(--text-muted); border-color: rgba(255,255,255,0.2);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="width:14px;height:14px; margin-right:6px; vertical-align:middle;">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 16v-4" />
                        <path d="M12 8h.01" />
                    </svg>
                    How to use AI Guides
                </button>
            </div>
            <div class="resource-grid" id="aiGuidesList">
                <!-- Populated by JS -->
            </div>
        </div>
    </main>
    <script>
        const MODULES = [
            { num: 'MRD', name: 'Aviation Regulations, Forms & Records', path: 'shared/course-viewer.html?path=rise-modules/maintenance-regs/aviation-regulations-maintenance-forms-records-and-publications&title=Aviation Regulations, Forms & Records' },

            { num: 'BET', name: 'Direct Current Fundamentals', path: 'shared/course-viewer.html?path=rise-modules/electricity-dc/fundamentals-of-direct-current&title=Direct Current Fundamentals' },
            { num: 'BET', name: 'Alternating Current Fundamentals', path: 'shared/course-viewer.html?path=rise-modules/electricity-ac/fundamentals-of-alternating-current&title=Alternating Current Fundamentals' },
            { num: 'BET', name: 'Solid State Devices', path: 'shared/course-viewer.html?path=rise-modules/electricity-solid/solid-state-devices&title=Solid State Devices' },
            { num: 'BET', name: 'Aircraft Electrical Systems', path: 'shared/course-viewer.html?path=rise-modules/basic-electrical/aircraft-electrical&title=Aircraft Electrical Systems' },

            { num: 'CNS', name: 'Dependent Navigation Systems', path: 'shared/course-viewer.html?path=rise-modules/cns-systems/dependent-navigation-systems&title=Dependent Navigation Systems' },
            { num: 'CNS', name: 'Radio Communication Systems', path: 'shared/course-viewer.html?path=rise-modules/cns-systems/radio-communication-systems&title=Radio Communication Systems' },
            { num: 'CNS', name: 'Surveillance Systems', path: 'shared/course-viewer.html?path=rise-modules/cns-systems/surveillance-systems&title=Surveillance Systems' },

            { num: 'FI', name: 'Flight Instruments', path: 'shared/course-viewer.html?path=rise-modules/flight-instruments/flight-instruments&title=Flight Instruments' },

            { num: 'DDS', name: 'Digital Electronics', path: 'shared/course-viewer.html?path=rise-modules/databus-systems/digital-electronics&title=Digital Electronics' },

            { num: 'AWH', name: 'Building a Wire Harness', path: 'shared/course-viewer.html?path=rise-modules/wiring-hardware/building-a-wire-harness&title=Building a Wire Harness' },

            { num: 'TTE', name: 'Basic Hand Tools & Hardware', path: 'shared/course-viewer.html?path=rise-modules/tools-test-equipment/basic-hand-tools-and-hardware&title=Basic Hand Tools & Hardware' },

            { num: 'SSP', name: 'Safety Essentials in Aviation', path: 'shared/course-viewer.html?path=rise-modules/shop-safety/safety-essentials-in-aviation&title=Safety Essentials in Aviation' }
        ];

        const listHtml = MODULES.map(m => `
      <a href="${m.path}" class="resource-card rise">
        <div class="resource-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </div>
        <div class="resource-info">
          <div class="resource-name">${m.name}</div>
          <div class="resource-meta">Category ${m.num} &bull; Interactive Module</div>
        </div>
        <div class="resource-action"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
      </a>
    `).join('');
        document.getElementById('riseModulesList').innerHTML = listHtml;

        const NOTEBOOK_LINKS = [
            { cat: 'ALL', name: 'CAET Study Boss (Comprehensive)', url: 'https://notebooklm.google.com/notebook/5bdd750c-8b81-4a09-9ec5-daf7e685f600' },
            { cat: 'MRD', name: 'Regulations, Forms & Records', url: 'https://notebooklm.google.com/notebook/4ec730e9-f975-4645-8224-381cd7cb1261' },
            { cat: 'BET', name: 'Fundamentals of Electricity', url: 'https://notebooklm.google.com/notebook/64f77e37-194f-48bf-b2f3-de3558ba1b62' },
            { cat: 'BET', name: 'Direct Current', url: 'https://notebooklm.google.com/notebook/0d8bdfcc-eef6-4dca-87c2-c71894115a80' },
            { cat: 'BET', name: 'Alternating Current', url: 'https://notebooklm.google.com/notebook/2f53925c-3def-467e-909d-9493da687371' },
            { cat: 'BET', name: 'Solid State Devices', url: 'https://notebooklm.google.com/notebook/7e9fde9e-eb66-45e2-82f7-9b081929864b' },
            { cat: 'BET', name: 'Aircraft Electrical', url: 'https://notebooklm.google.com/notebook/dad78107-8b8c-4121-a152-bec2492dbfc2' },
            { cat: 'CNS', name: 'CNS Systems', url: 'https://notebooklm.google.com/notebook/e5f4f1aa-0a29-497b-8a88-1d2ef0175387' },
            { cat: 'FI', name: 'Pitot-Static Systems', url: 'https://notebooklm.google.com/notebook/8073baef-d9cf-4153-8e35-90279a8e1b2b' },
            { cat: 'DDS', name: 'Digital Electronics', url: 'https://notebooklm.google.com/notebook/64bf4b91-6dbe-437b-873d-9e6673d94f60' },
            { cat: 'DDS', name: 'Digital Data Bus Systems', url: 'https://notebooklm.google.com/notebook/033c0b10-c82c-4d2c-b2bb-f23bb22d4491' },
            { cat: 'AWH', name: 'Aircraft Wiring', url: 'https://notebooklm.google.com/notebook/37abaeae-80fe-47cd-a6b3-dae7cebb69dd' },
            { cat: 'TTE', name: 'Aircraft Handtools & Hardware', url: 'https://notebooklm.google.com/notebook/dbcb4510-acc0-4cec-87e6-45ac538d6327' },
            { cat: 'SSP', name: 'Aviation Safety', url: 'https://notebooklm.google.com/notebook/73ca69b8-23b9-44fe-b18d-cf5b83810be2' }
        ];

        const aiHtml = NOTEBOOK_LINKS.map(n => `
      <a href="${n.url}" target="_blank" class="resource-card notebook">
        <div class="resource-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2A2 2 0 0 1 14 4V6H20A2 2 0 0 1 22 8V18A2 2 0 0 1 20 20H4A2 2 0 0 1 2 18V8A2 2 0 0 1 4 6H10V4A2 2 0 0 1 12 2z"/>
            <path d="M6 10H6.01"/><path d="M18 10H18.01"/><path d="M10 16H14"/>
          </svg>
        </div>
        <div class="resource-info">
          <div class="resource-name">${n.name}</div>
          <div class="resource-meta">Category ${n.cat} &bull; Ask the AI</div>
        </div>
        <div class="resource-action"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg></div>
      </a>
    `).join('');
        document.getElementById('aiGuidesList').innerHTML = aiHtml;

        // Update the badge count dynamically
        document.querySelector('.section-badge').textContent = `${MODULES.length} Available`;
        document.querySelector('.section-badge.green').textContent = `${NOTEBOOK_LINKS.length} Notebooks`;
    </script>
</body>

</html>
