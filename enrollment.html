<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACE Avionics Training — Sign In</title>
  <link rel="icon" type="image/png" href="shared/ace-sprites/ace-48-happy.png">
  <link rel="stylesheet" href="shared/ace-theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080C1A;
      font-family: var(--font-sans, system-ui, sans-serif);
      padding: 1.5rem;
    }
    .card {
      background: rgba(20, 24, 38, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .logo img { width: 40px; height: 40px; border-radius: 8px; }
    .logo-text { font-size: 1.1rem; font-weight: 700; color: #e0e0e0; }
    h1 { font-size: 1.5rem; font-weight: 800; color: #e0e0e0; margin-bottom: 0.5rem; }
    .subtitle { color: #8891a8; font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #6b7280;
            text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    input, select {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #e0e0e0;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #D4A853; }
    select { appearance: none; cursor: pointer; }
    input#code { text-transform: uppercase; letter-spacing: 0.12em; font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; text-align: center; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #D4A853, #b8912e);
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212,168,83,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .error.visible { display: block; }
    .help {
      text-align: center;
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 1.5rem;
    }
    .help a { color: #D4A853; text-decoration: none; }
    .help a:hover { text-decoration: underline; }
    .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 1.5rem 0; }
    #enrollForm { display: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    .step-indicator {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 1.5rem;
    }
    .step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .step-dot.active { background: #D4A853; width: 24px; border-radius: 4px; }
    .step-dot.done { background: #10b981; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="shared/logo.png" alt="ACE">
    <span class="logo-text">ACE Avionics Training</span>
  </div>

  <!-- STEP 1: Access Code -->
  <div id="loginStep">
    <h1>Welcome Back</h1>
    <p class="subtitle">Enter your access code to continue your training.</p>

    <div class="error" id="errorMsg"></div>

    <label for="code">Access Code</label>
    <input type="text" id="code" placeholder="ACE-XXXX-XXXX" maxlength="14" autocomplete="off">

    <button class="btn" id="loginBtn" onclick="handleLogin()">Continue</button>

    <p class="help">
      Don't have a code? <a href="checkout.html">Purchase access here</a><br>
      Need help? <a href="mailto:help@aceavionicstraining.com">Contact support</a>
    </p>
  </div>

  <!-- STEP 2: First-time enrollment (hidden until needed) -->
  <div id="enrollForm">
    <div class="step-indicator">
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
    </div>

    <h1>Set Up Your Profile</h1>
    <p class="subtitle">One-time setup so we can personalize your training experience.</p>

    <div class="error" id="enrollError"></div>

    <div class="form-row">
      <div>
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="First" autocomplete="given-name">
      </div>
      <div>
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Last" autocomplete="family-name">
      </div>
    </div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

    <label for="background">Aviation Background</label>
    <select id="background">
      <option value="">Select your background...</option>
      <option value="military">Military Avionics (Active/Veteran)</option>
      <option value="civilian_shop">Civilian Repair Station / Shop</option>
      <option value="part147">Part 147 School Student</option>
      <option value="career_change">Career Changer / New to Aviation</option>
      <option value="employer">Employer / Training Manager</option>
      <option value="other">Other</option>
    </select>

    <label for="experience">Years in Avionics</label>
    <select id="experience">
      <option value="">Select experience level...</option>
      <option value="0">Brand New (0 years)</option>
      <option value="1-3">1-3 years</option>
      <option value="4-8">4-8 years</option>
      <option value="9-15">9-15 years</option>
      <option value="15+">15+ years</option>
    </select>

    <label for="referral">How did you hear about us?</label>
    <select id="referral">
      <option value="">Select...</option>
      <option value="aea">AEA / Convention</option>
      <option value="employer">My Employer</option>
      <option value="school">My School</option>
      <option value="linkedin">LinkedIn</option>
      <option value="google">Google Search</option>
      <option value="colleague">Colleague / Word of Mouth</option>
      <option value="reddit">Reddit</option>
      <option value="other">Other</option>
    </select>

    <button class="btn" id="enrollBtn" onclick="handleEnroll()">Start Training →</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/js/ace-auth.js"></script>
<script>
  let pendingEnrollment = null;

  // Auto-format code input
  document.getElementById('code').addEventListener('input', function(e) {
    let val = e.target.value.replace(/[^A-Z0-9]/gi, '').toUpperCase().slice(0, 11);
    if (val.length > 7) val = 'ACE-' + val.slice(3, 7) + '-' + val.slice(7);
    else if (val.length > 3) val = 'ACE-' + val.slice(3);
    e.target.value = val;
  });

  // Enter key submits
  document.getElementById('code').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleLogin();
  });

  async function handleLogin() {
    const code = document.getElementById('code').value.trim().toUpperCase();
    const errorEl = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');
    errorEl.classList.remove('visible');

    if (code.length < 13) return showError('errorMsg', 'Enter your full access code (ACE-XXXX-XXXX).');

    btn.disabled = true;
    btn.textContent = 'Checking…';

    // Look up code in Supabase
    const db = AceAuth.getDB();
    const { data, error } = await db
      .from('ace_enrollments')
      .select('id, plan, expires_at, is_active, activated_at, student_name, email')
      .eq('access_code', code)
      .single();

    if (error || !data) {
      showError('errorMsg', 'Access code not found. Check your email and try again.');
      btn.disabled = false;
      btn.textContent = 'Continue';
      return;
    }
    if (!data.is_active) {
      showError('errorMsg', 'This code has been deactivated. Contact support.');
      btn.disabled = false;
      btn.textContent = 'Continue';
      return;
    }

    // Already activated? Just log in (returning student skips onboarding).
    if (data.activated_at && data.student_name) {
      const session = {
        id: data.id,
        name: data.student_name,
        plan: data.plan,
        expires_at: data.expires_at,
        code: code
      };
      localStorage.setItem('ace_enrollment', JSON.stringify(session));
      localStorage.setItem('caet-onboarding-complete', 'true');
      window.location.href = 'dashboard.html';
      return;
    }

    // First time — show enrollment form
    pendingEnrollment = { id: data.id, plan: data.plan, expires_at: data.expires_at, code: code };
    if (data.email) document.getElementById('email').value = data.email;
    document.getElementById('loginStep').style.display = 'none';
    document.getElementById('enrollForm').style.display = 'block';
  }

  async function handleEnroll() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const background = document.getElementById('background').value;
    const experience = document.getElementById('experience').value;
    const referral = document.getElementById('referral').value;
    const btn = document.getElementById('enrollBtn');

    if (!firstName || !lastName) return showError('enrollError', 'Please enter your full name.');
    if (!email) return showError('enrollError', 'Please enter your email address.');

    btn.disabled = true;
    btn.textContent = 'Setting up…';

    const fullName = firstName + ' ' + lastName;
    const db = AceAuth.getDB();

    // Update enrollment with student info
    await db.from('ace_enrollments').update({
      student_name: fullName,
      email: email,
      activated_at: new Date().toISOString()
    }).eq('id', pendingEnrollment.id);

    // Store session
    const session = {
      id: pendingEnrollment.id,
      name: fullName,
      plan: pendingEnrollment.plan,
      expires_at: pendingEnrollment.expires_at,
      code: pendingEnrollment.code
    };
    localStorage.setItem('ace_enrollment', JSON.stringify(session));

    // New student goes to onboarding
    localStorage.removeItem('caet-onboarding-complete');
    window.location.href = 'dashboard.html';
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('visible');
  }

  // If already enrolled, go straight to dashboard
  document.addEventListener('DOMContentLoaded', async () => {
    const session = await AceAuth.getSession();
    if (session) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
