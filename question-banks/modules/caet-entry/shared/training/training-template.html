<!DOCTYPE html>
<html lang="en" data-theme="dark">
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  ACE Training Page Template                                      ║
  ║  Self-contained interactive lesson — no S3/RISE dependency       ║
  ║                                                                  ║
  ║  Usage:                                                          ║
  ║  1. Copy this template to a new file (e.g. cat-1-lesson.html)   ║
  ║  2. Set LESSON_CONFIG at the bottom with your lesson data        ║
  ║  3. Populate the <main> sections with content                    ║
  ║                                                                  ║
  ║  URL params:                                                     ║
  ║    ?back=<url>  — where the back button goes                     ║
  ║    ?cat=<id>    — category ID for localStorage keys              ║
  ║    ?mod=<id>    — module ID for completion tracking               ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACE Training | Loading...</title>
  <link rel="icon" type="image/png" href="../../../../shared/ace-sprites/ace-48-happy.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../../shared/ace-theme.css">

  <style>
    /* ── Base reset ─────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-secondary);
      min-height: 100vh;
      line-height: 1.7;
    }
    a { color: var(--gold); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Training topbar ───────────────────────────────────── */
    .training-topbar {
      position: sticky; top: 0; z-index: 100;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; gap: 16px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 14px;
      cursor: pointer; transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-back:hover { border-color: var(--gold); color: var(--text-primary); text-decoration: none; }
    .module-title {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 400px;
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .reading-progress {
      font-size: 12px; font-weight: 500; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-theme {
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s ease; color: var(--text-secondary);
      font-size: 15px; cursor: pointer;
    }
    .btn-theme:hover { border-color: var(--gold); color: var(--text-primary); }

    /* ── Progress bar (thin line under topbar) ─────────────── */
    .progress-line {
      position: sticky; top: 52px; z-index: 99;
      height: 3px; background: var(--surface-2);
    }
    .progress-line-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--gold), #E8C36A);
      transition: width 0.3s ease;
    }

    /* ── Content area ──────────────────────────────────────── */
    .training-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 100px;
    }

    /* ── Lesson header ─────────────────────────────────────── */
    .lesson-header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .lesson-category {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--gold); margin-bottom: 8px;
    }
    .lesson-title {
      font-size: 28px; font-weight: 800; color: var(--text-primary);
      line-height: 1.2; margin-bottom: 12px;
    }
    .lesson-desc {
      font-size: 15px; color: var(--text-muted); line-height: 1.6;
    }
    .lesson-meta {
      display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap;
    }
    .lesson-meta-item {
      font-size: 12px; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .lesson-meta-item svg { width: 14px; height: 14px; color: var(--text-muted); }

    /* ── Section ───────────────────────────────────────────── */
    .training-section {
      margin-bottom: 48px;
    }
    .training-section h2 {
      font-size: 20px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 16px; padding-bottom: 8px;
      border-bottom: 2px solid var(--gold);
      display: inline-block;
    }
    .training-section h3 {
      font-size: 16px; font-weight: 600; color: var(--text-primary);
      margin: 24px 0 12px;
    }
    .training-section p {
      font-size: 15px; color: var(--text-secondary); line-height: 1.7;
      margin-bottom: 16px;
    }
    .training-section ul, .training-section ol {
      margin: 0 0 16px 20px;
      font-size: 15px; color: var(--text-secondary); line-height: 1.7;
    }
    .training-section li { margin-bottom: 6px; }

    /* ── Key concept box ───────────────────────────────────── */
    .key-concept {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .key-concept-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--gold); margin-bottom: 8px;
    }
    .key-concept p { margin-bottom: 8px; }
    .key-concept p:last-child { margin-bottom: 0; }

    /* ── Example box ───────────────────────────────────────── */
    .example-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .example-box-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .example-box p { margin-bottom: 8px; }
    .example-box p:last-child { margin-bottom: 0; }

    /* ── Warning / important callout ───────────────────────── */
    .callout-warning {
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.2);
      border-left: 4px solid var(--warning);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0;
    }
    .callout-warning-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--warning); margin-bottom: 6px;
    }

    /* ── ACE tip / analogy ─────────────────────────────────── */
    .ace-tip {
      background: var(--gold-soft);
      border: 1px solid rgba(212, 168, 83, 0.2);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .ace-tip-avatar {
      width: 40px; height: 40px; flex-shrink: 0;
      image-rendering: pixelated; image-rendering: crisp-edges;
      border-radius: 50%;
    }
    .ace-tip-content { flex: 1; min-width: 0; }
    .ace-tip-name {
      font-size: 11px; font-weight: 700; color: var(--gold);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .ace-tip-text {
      font-size: 14px; color: var(--text-primary);
      line-height: 1.6; font-style: italic;
    }

    /* ── Term definition inline ─────────────────────────────── */
    .term-def {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 16px 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
    }
    .term-word {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 600;
      color: var(--gold);
      background: var(--gold-soft);
      padding: 4px 10px; border-radius: 4px;
      white-space: nowrap;
    }
    .term-meaning {
      font-size: 14px; color: var(--text-secondary); line-height: 1.6;
    }

    /* ── Quick check (embedded comprehension Q) ────────────── */
    .quick-check {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin: 32px 0;
    }
    .qc-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    .qc-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; padding: 3px 10px; border-radius: 999px;
      background: rgba(75,139,245,0.12); color: #4B8BF5;
    }
    .qc-question {
      font-size: 15px; font-weight: 600; color: var(--text-primary);
      line-height: 1.5; margin-bottom: 16px;
    }
    .qc-options {
      display: flex; flex-direction: column; gap: 8px;
    }
    .qc-option {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 14px; color: var(--text-secondary);
    }
    .qc-option:hover { border-color: var(--gold); color: var(--text-primary); }
    .qc-option.selected { border-color: var(--gold); background: var(--gold-soft); color: var(--text-primary); }
    .qc-option.correct { border-color: var(--success); background: rgba(52,211,153,0.1); color: var(--success); }
    .qc-option.incorrect { border-color: var(--danger); background: rgba(248,113,113,0.08); color: var(--danger); }
    .qc-letter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 700;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .qc-option.correct .qc-letter { background: rgba(52,211,153,0.2); border-color: var(--success); color: var(--success); }
    .qc-option.incorrect .qc-letter { background: rgba(248,113,113,0.15); border-color: var(--danger); color: var(--danger); }
    .qc-feedback {
      margin-top: 12px; padding: 12px 16px;
      border-radius: 8px; font-size: 13px; line-height: 1.6;
      display: none;
    }
    .qc-feedback.correct {
      display: block;
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.2);
      color: var(--text-secondary);
    }
    .qc-feedback.incorrect {
      display: block;
      background: rgba(248,113,113,0.06);
      border: 1px solid rgba(248,113,113,0.15);
      color: var(--text-secondary);
    }

    /* ── Expandable details ─────────────────────────────────── */
    details.expand-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 16px 0;
      overflow: hidden;
    }
    details.expand-section summary {
      padding: 14px 20px;
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      cursor: pointer; user-select: none;
      list-style: none;
      display: flex; align-items: center; gap: 8px;
    }
    details.expand-section summary::before {
      content: '>';
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--text-muted);
      transition: transform 0.2s ease;
      display: inline-block;
    }
    details.expand-section[open] summary::before { transform: rotate(90deg); }
    details.expand-section .expand-body {
      padding: 0 20px 16px;
      font-size: 14px; color: var(--text-secondary); line-height: 1.7;
    }

    /* ── Completion footer ─────────────────────────────────── */
    .training-complete {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px 80px;
      text-align: center;
    }
    .complete-divider {
      height: 1px; background: var(--border); margin-bottom: 32px;
    }
    .complete-message {
      font-size: 16px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 8px;
    }
    .complete-sub {
      font-size: 13px; color: var(--text-muted); margin-bottom: 20px;
    }
    .btn-complete {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, var(--gold), #C49540);
      border: none; border-radius: 8px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      color: #080C1A; cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-complete:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(212,168,83,0.25); }
    .btn-complete.done {
      background: var(--success);
      cursor: default;
    }
    .btn-complete.done:hover { transform: none; box-shadow: none; }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 600px) {
      .training-content { padding: 24px 16px 80px; }
      .lesson-title { font-size: 22px; }
      .module-title { max-width: 180px; }
      .ace-tip { flex-direction: column; align-items: center; text-align: center; }
      .term-def { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       TOPBAR
  ═══════════════════════════════════════════════════════ -->
  <nav class="training-topbar">
    <div class="topbar-left">
      <a href="#" class="btn-back" id="btnBack">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back
      </a>
      <span class="module-title" id="moduleTitle">Loading...</span>
    </div>
    <div class="topbar-right">
      <span class="reading-progress" id="readingProgress">0%</span>
      <button class="btn-theme" id="btnTheme" title="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </nav>

  <!-- Progress line -->
  <div class="progress-line">
    <div class="progress-line-fill" id="progressFill"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       LESSON CONTENT (replace this section per lesson)
  ═══════════════════════════════════════════════════════ -->
  <main class="training-content" id="trainingContent">
    <!-- Lesson header -->
    <div class="lesson-header" id="lessonHeader">
      <div class="lesson-category" id="lessonCategory">CATEGORY</div>
      <h1 class="lesson-title" id="lessonTitle">Lesson Title</h1>
      <p class="lesson-desc" id="lessonDesc">Lesson description goes here.</p>
      <div class="lesson-meta">
        <span class="lesson-meta-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span id="lessonTime">25 min</span>
        </span>
        <span class="lesson-meta-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span id="lessonSections">0 sections</span>
        </span>
      </div>
    </div>

    <!-- Sections will be here (populated per lesson) -->
    <div id="sectionsContainer">
      <!-- LESSON SECTIONS GO HERE -->
    </div>
  </main>

  <!-- ═══════════════════════════════════════════════════════
       COMPLETION FOOTER
  ═══════════════════════════════════════════════════════ -->
  <footer class="training-complete" id="completionFooter">
    <div class="complete-divider"></div>
    <div class="complete-message">Ready to move on?</div>
    <div class="complete-sub">You've reached the end of this training module.</div>
    <button class="btn-complete" id="btnComplete" onclick="markComplete()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      Mark Complete &amp; Return
    </button>
  </footer>

  <!-- ═══════════════════════════════════════════════════════
       TRAINING PAGE JS
  ═══════════════════════════════════════════════════════ -->
  <script>
  /* ── URL params ── */
  const params = new URLSearchParams(window.location.search);
  const backUrl = params.get('back') || '../../index.html';
  const catId   = params.get('cat')  || 'cat-1';
  const modId   = params.get('mod')  || 'unknown';

  /* ── Back button ── */
  document.getElementById('btnBack').href = backUrl;

  /* ── Theme toggle ── */
  const htmlEl = document.documentElement;
  const btnTheme = document.getElementById('btnTheme');
  const themeIcon = document.getElementById('themeIcon');
  const SUN_PATH  = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  const MOON_PATH = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

  function applyTheme(t) {
    htmlEl.setAttribute('data-theme', t);
    themeIcon.innerHTML = t === 'dark' ? MOON_PATH : SUN_PATH;
    try { localStorage.setItem('ace_theme', JSON.stringify(t)); } catch(e) {}
  }
  btnTheme.addEventListener('click', () => {
    applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  try {
    const saved = localStorage.getItem('ace_theme');
    if (saved) applyTheme(JSON.parse(saved));
  } catch(e) {}

  /* ── Reading progress ── */
  function updateProgress() {
    const scrollTop    = window.scrollY;
    const docHeight    = document.documentElement.scrollHeight - window.innerHeight;
    const pct          = docHeight > 0 ? Math.min(Math.round((scrollTop / docHeight) * 100), 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('readingProgress').textContent = pct + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();

  /* ── Quick check interaction ── */
  function initQuickChecks() {
    document.querySelectorAll('.quick-check').forEach(qc => {
      const correctIdx = parseInt(qc.dataset.correct, 10);
      const options = qc.querySelectorAll('.qc-option');
      const feedback = qc.querySelector('.qc-feedback');
      let answered = false;

      options.forEach((opt, idx) => {
        opt.addEventListener('click', () => {
          if (answered) return;
          answered = true;

          // Mark correct/incorrect
          options.forEach((o, i) => {
            if (i === correctIdx) o.classList.add('correct');
            else if (i === idx && i !== correctIdx) o.classList.add('incorrect');
            o.style.pointerEvents = 'none';
          });

          // Show feedback
          if (feedback) {
            feedback.classList.add(idx === correctIdx ? 'correct' : 'incorrect');
          }
        });
      });
    });
  }

  /* ── Mark complete ── */
  function markComplete() {
    const btn = document.getElementById('btnComplete');
    if (btn.classList.contains('done')) {
      window.location.href = backUrl;
      return;
    }

    // Save completion to localStorage
    try {
      localStorage.setItem(`ace_cat_${catId}_training_${modId}_complete`, 'true');
      localStorage.setItem(`ace_cat_${catId}_training_${modId}_started`, 'true');
    } catch(e) {}

    btn.classList.add('done');
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Complete! Returning...';

    setTimeout(() => { window.location.href = backUrl; }, 800);
  }

  /* ── Check if already complete ── */
  function checkCompletion() {
    const isComplete = localStorage.getItem(`ace_cat_${catId}_training_${modId}_complete`) === 'true';
    if (isComplete) {
      const btn = document.getElementById('btnComplete');
      btn.classList.add('done');
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Completed — Return to Hub';
      btn.onclick = function() { window.location.href = backUrl; };
    }
  }

  /* ── Mark started ── */
  function markStarted() {
    try {
      localStorage.setItem(`ace_cat_${catId}_training_${modId}_started`, 'true');
    } catch(e) {}
  }

  /* ── Init lesson config (called by content page) ── */
  function initLesson(config) {
    document.title = `${config.title} | ACE Training`;
    document.getElementById('moduleTitle').textContent = config.title;
    document.getElementById('lessonCategory').textContent = config.category || 'TRAINING';
    document.getElementById('lessonTitle').textContent = config.title;
    document.getElementById('lessonDesc').textContent = config.description || '';
    document.getElementById('lessonTime').textContent = (config.estimatedMinutes || 25) + ' min';

    const sections = document.querySelectorAll('.training-section');
    document.getElementById('lessonSections').textContent = sections.length + ' sections';

    markStarted();
    checkCompletion();
    initQuickChecks();
  }

  /* ── Auto-init if LESSON_CONFIG is defined ── */
  if (typeof LESSON_CONFIG !== 'undefined') {
    initLesson(LESSON_CONFIG);
  }
  </script>
</body>
</html>
